name: tests

on:
  push:
    branches: ["main", "mask-boundary-distance-diagnostics", "codex-full-audit-2026-11-01", "automatic-subject-segmentation", "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests --select E4,E7,E9,F
      - name: Validate Unix launcher syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/run_local.sh
      - name: Validate PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/run_local.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Test
        run: pytest -q

  segmentation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional CPU segmentation dependencies
        run: python -m pip install -e ".[dev,segmentation]"
      - name: Run real U2-Net CPU inference smoke test
        env:
          IMAGE_CREATE_RUN_MODEL_SMOKE: "1"
          OMP_NUM_THREADS: "2"
        run: python -m pytest -q tests/test_automatic_segmentation.py -k real_u2net_model_smoke
