name: tests

on:
  push:
    branches: ["main", "mask-boundary-distance-diagnostics", "codex-full-audit-2026-11-01", "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests --select E4,E7,E9,F
      - name: Validate local launcher syntax
        run: bash -n scripts/run_local.sh
      - name: Test
        run: pytest -q
